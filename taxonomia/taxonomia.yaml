# Taxonomía del catálogo: las facetas del explorador y sus categorías.
# Es la única fuente de los filtros: tools/build.py la lee y la vuelca en index.es.json e index.en.json,
# que es lo que carga app.js (que no tiene ninguna faceta escrita a mano).
#
# Cada faceta:
#   key       campo de la cabecera YAML de fichas/<id>.<idioma>.md (el mismo en los dos idiomas)
#   label     etiqueta del filtro en cada idioma
#   type      single_select (una opción, como un radio) o multi_select (varias)
#   dynamic   true = las opciones salen de las fichas (año, cliente); false = son las de esta lista
#   grupo     principal (siempre a la vista) o mas (dentro de «Más filtros»)
#   interna   true = solo se enseña con sesión de empleado (nombre del cliente)
#   derivada  cómo la calcula el build cuando la ficha no trae el campo
#   options   id (lo que va en la ficha; en las facetas de Alberto es la etiqueta en castellano),
#             es / en (etiquetas; si faltan, la etiqueta es el id)
#
# Las seis primeras claves (sector, tecnologia, tipo_proyecto, partner, bu, anio) son las del catálogo
# de Alberto y sus opciones son las suyas. El resto viene del playbook de Gerard (lista de facetas de
# Nacho, 21/09/2026): solo se pintan cuando alguna ficha trae el campo.
version: 2
facets:
- key: sector
  label: {es: Sector, en: Industry}
  type: single_select
  dynamic: false
  grupo: principal
  options:
  - {id: Salud, en: Healthcare}
  - {id: Banca y Finanzas, en: Banking & Finance}
  - {id: Seguros, en: Insurance}
  - {id: Telecomunicaciones, en: Telecommunications}
  - {id: Industria y Fabricación, en: Manufacturing}
  - {id: Retail y Consumo, en: Retail & Consumer}
  - {id: Sector Público, en: Public Sector}
  - {id: Energía y Utilities, en: Energy & Utilities}
  - {id: Logística y Transporte, en: Logistics & Transport}
